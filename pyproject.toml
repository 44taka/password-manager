[project]
name = "password-manager"
version = "0.1.5"
description = "A lightweight macOS menubar password manager"
readme = "README.md"
authors = [
    { name = "44taka", email = "yoshitaka.i.v.x.jade@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "injector>=0.24.0",
    "keyring>=25.7.0",
    "pyperclip>=1.11.0",
    "pyside6>=6.10.2",
    "thefuzz[speedup]>=0.22.1",
]

[project.scripts]
password-manager = "password_manager.app:main"

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "py2app>=0.28.10",
    "pyinstaller>=6.19.0",
    "pyright>=1.1.0",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "D",   # pydocstyle
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-none-returning = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # テストでは assert を許可。型ヒント(ANN)とdocstring(D)は必須。

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["src"]
strict = []
