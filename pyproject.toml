[project]
name = "password-manager"
version = "0.1.6"
description = "A lightweight macOS menubar password manager"
readme = "README.md"
authors = [
    { name = "44taka", email = "yoshitaka.i.v.x.jade@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flet>=0.23.0",
    "injector>=0.24.0",
    "keyring>=25.7.0",
    "pyperclip>=1.11.0",
    "pyside6>=6.10.2",
    "sentry-sdk>=2.59.0",
    "sqlmodel>=0.0.38",
]

[project.scripts]
password-manager = "password_manager.app:main"

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "py2app>=0.28.10",
    "pyinstaller>=6.19.0",
    "pyright>=1.1.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "D",   # pydocstyle
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
]
ignore = [
    "D400", # 概要文の末尾のピリオド強制（日本語だと"。"を使うため）
    "D415", # 概要文の末尾のピリオド強制（日本語だと"。"を使うため）
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-none-returning = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"] # テストでは assert とハードコードされたパスワードを許可。

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["src"]
strict = []

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
]

[tool.flet]
artifact = "Password Manager"
bundle_id = "com.44taka.password-manager"
org = "com.44taka"
product = "Password Manager"
company = "44taka"

[tool.flet.app]
# path = "src"
path = "src/password_manager"

[tool.flet.macos.info]
LSUIElement = false
LSApplicationCategoryType = "public.app-category.utilities"

[tool.flet.macos.entitlements]
"com.apple.security.app-sandbox" = false
"keychain-access-groups" = ["com.44taka.password-manager"]
