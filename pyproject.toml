[project]
name = "password-manager"
version = "0.1.0"
description = "A lightweight macOS menubar password manager"
readme = "README.md"
authors = [
    { name = "44taka", email = "yoshitaka.i.v.x.jade@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "keyring>=25.7.0",
    "pynput>=1.8.1",
    "pyperclip>=1.11.0",
    "rumps>=0.4.0",
    "thefuzz[speedup]>=0.22.1",
]

[project.scripts]
password-manager = "password_manager.app:main"

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
]
